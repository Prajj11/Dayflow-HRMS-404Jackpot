services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dayflow
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dayflow
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_API_KEY_FALLBACK: ${GROQ_API_KEY_FALLBACK}
    depends_on:
      - postgres
      - redis

  mcpserver:
    build: ./mcpserver
    ports:
      - "8091:8081"
    environment:
      QUERY_API_BASE: http://backend:8080
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8090
    ports:
      - "3090:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
